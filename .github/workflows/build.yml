name: Build macOS

on:
  push:
    branches: [main]
    tags: ['mac-release-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Electron DMG
        shell: bash
        run: |
          set +e
          npm run build:mac:${{ matrix.arch }} 2>&1 | tee electron-builder-${{ matrix.arch }}.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### electron-builder failed (${{ matrix.arch }})"
              echo '```'
              tail -n 120 electron-builder-${{ matrix.arch }}.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message="$(tail -n 20 electron-builder-${{ matrix.arch }}.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=electron-builder failed (${{ matrix.arch }})::$message"
            exit "$status"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Decommenter pour la notarisation Apple (optionnel)
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename release asset
        if: startsWith(github.ref, 'refs/tags/mac-release-')
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            suffix="arm64V2"
          else
            suffix="x64V1"
          fi
          dmg="$(find dist -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "::error title=Missing DMG::No DMG file found in dist"
            exit 1
          fi
          mv "$dmg" "dist/Rurale-Nous-macOS-${suffix}.dmg"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/mac-release-')
        uses: softprops/action-gh-release@v2
        with:
          name: Rurale-Nous macOS ${{ github.ref_name }}
          files: dist/Rurale-Nous-macOS-*.dmg
          fail_on_unmatched_files: true

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rurale-Nous-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log-${{ matrix.arch }}
          path: electron-builder-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7
